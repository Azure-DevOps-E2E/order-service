trigger:
  batch: true
  branches:
    include:
    - feature/*

pr:
  autoCancel: true
  branches:
    include:
    - dev
    - main

resources:
  repositories:
  - repository: templates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

variables:
- name: serviceName
  value: 'order-service'
- name: javaVersion
  value: '21'
- name: testResultsFiles
  value: '$(System.DefaultWorkingDirectory)/**/surefire-reports/TEST-*.xml'
- name: coverageSummaryFile
  value: '$(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml'

pool:
  name: azure-agent

extends:
  template: pipelines/templates/pipeline-contract.yml@templates
  parameters:
    pipelineStages:
    - stage: CI
      displayName: 'CI - $(serviceName)'
      jobs:
      - job: Quality
        displayName: 'Test and build $(serviceName)'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 1
          displayName: 'Checkout source code'

        # Host Java setup is kept commented for rollback. Quality now runs in Docker.
        # - task: JavaToolInstaller@0
        #   displayName: 'Use Java $(javaVersion)'
        #   inputs:
        #     versionSpec: '$(javaVersion)'
        #     jdkArchitectureOption: x64
        #     jdkSourceOption: PreInstalled
        #
        # - template: steps/maven/verify.yml@templates

        - template: steps/container/prepare-build-image.yml@templates
          parameters:
            runtime: java
            version: '$(javaVersion)'

        - template: steps/maven/quality-container.yml@templates
          parameters:
            cacheKey: '$(serviceName)-java$(javaVersion)'

        - task: PublishTestResults@2
          displayName: 'Publish test report'
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: JUnit
            testResultsFiles: '$(testResultsFiles)'
            searchFolder: '$(System.DefaultWorkingDirectory)'
            mergeTestResults: true
            failTaskOnFailedTests: true
            failTaskOnFailureToPublishResults: true
            failTaskOnMissingResultsFile: true
            testRunTitle: '$(serviceName) tests'

        - task: UseDotNet@2
          displayName: 'Use .NET SDK for coverage publisher'
          condition: succeededOrFailed()
          inputs:
            packageType: sdk
            version: '8.x'

        - task: PublishCodeCoverageResults@2
          displayName: 'Publish coverage report'
          condition: succeededOrFailed()
          inputs:
            summaryFileLocation: '$(coverageSummaryFile)'
            pathToSources: '$(Build.SourcesDirectory)'
            failIfCoverageEmpty: true
