trigger:
  batch: true
  branches:
    include:
    - feature/*

pr:
  autoCancel: true
  branches:
    include:
    - dev
    - main

resources:
  repositories:
  - repository: templates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

variables:
- group: order-service
- name: serviceName
  value: 'order-service'
- name: javaVersion
  value: '21'
- name: testResultsFiles
  value: '$(System.DefaultWorkingDirectory)/**/surefire-reports/TEST-*.xml'
- name: coverageSummaryFile
  value: '$(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml'

pool:
  name: azure-agent

extends:
  template: pipelines/templates/pipeline-contract.yml@templates
  parameters:
    pipelineStages:
    - stage: CI
      displayName: 'CI - $(serviceName)'
      jobs:
      - job: Quality
        displayName: 'Test and build $(serviceName)'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 0
          displayName: 'Checkout source code'

        - template: steps/detect-changes.yml@templates
          parameters:
            targetBranch: 'main'

        - template: steps/security-scan.yml@templates
          parameters:
            runtime: java
            condition: and(succeeded(), eq(variables['detect.skipHeavyCI'], 'false'))

        - template: steps/container/prepare-build-image.yml@templates
          parameters:
            runtime: java
            version: '$(javaVersion)'
            condition: and(succeeded(), eq(variables['detect.skipHeavyCI'], 'false'))

        - template: steps/maven/quality-container.yml@templates
          parameters:
            cacheKey: '$(serviceName)-java$(javaVersion)'
            condition: and(succeeded(), eq(variables['detect.skipHeavyCI'], 'false'))

        - task: PublishTestResults@2
          displayName: 'Publish test report'
          condition: and(succeededOrFailed(), eq(variables['detect.skipHeavyCI'], 'false'))
          inputs:
            testResultsFormat: JUnit
            testResultsFiles: '$(testResultsFiles)'
            searchFolder: '$(System.DefaultWorkingDirectory)'
            mergeTestResults: true
            failTaskOnFailedTests: true
            failTaskOnFailureToPublishResults: true
            failTaskOnMissingResultsFile: false
            testRunTitle: '$(serviceName) tests'

        - task: UseDotNet@2
          displayName: 'Use .NET SDK for coverage publisher'
          condition: and(succeededOrFailed(), eq(variables['detect.skipHeavyCI'], 'false'))
          inputs:
            packageType: sdk
            version: '8.x'

        - task: PublishCodeCoverageResults@2
          displayName: 'Publish coverage report'
          condition: and(succeededOrFailed(), eq(variables['detect.skipHeavyCI'], 'false'))
          inputs:
            summaryFileLocation: '$(coverageSummaryFile)'
            pathToSources: '$(Build.SourcesDirectory)'
            failIfCoverageEmpty: true

        - template: steps/qodana-scan.yml@templates
          parameters:
            linter: 'jetbrains/qodana-jvm-community'
            maxMemory: '1024m'
            condition: and(succeeded(), eq(variables['detect.skipHeavyCI'], 'false'))

        - template: steps/qodana-quality-gate.yml@templates
          parameters:
            failThreshold: 0
            failOnCritical: true
            condition: and(succeeded(), eq(variables['detect.skipHeavyCI'], 'false'))
