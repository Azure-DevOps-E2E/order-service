trigger:
  branches:
    include:
    - '*'

pr:
  branches:
    include:
    - '*'

resources:
  repositories:
  - repository: configTemplates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

pool:
  vmImage: ubuntu-latest

stages:
- template: pipelines/templates/service-stages.yml@configTemplates
  parameters:
    serviceName: order-service
    imageName: order-service
    dockerfilePath: Dockerfile
    containerRegistry: acrLoginServer
    qualitySteps:
    - template: pipelines/templates/steps/checkout.yml@configTemplates
    - template: pipelines/templates/steps/maven/setup.yml@configTemplates
    - template: pipelines/templates/steps/maven/verify.yml@configTemplates
    - template: pipelines/templates/steps/reports.yml@configTemplates
      parameters:
        testResultsFiles: '$(System.DefaultWorkingDirectory)/**/surefire-reports/TEST-*.xml'
        coverageSummaryFile: '$(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml'
    - template: pipelines/templates/steps/qodana.yml@configTemplates
      parameters:
        linter: qodana-jvm-community
