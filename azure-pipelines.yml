trigger:
  branches:
    include:
    - '*'

pr:
  branches:
    include:
    - '*'

resources:
  repositories:
  - repository: configTemplates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

pool:
  vmImage: ubuntu-latest

stages:
- template: pipelines/templates/service-stages.yml@configTemplates
  parameters:
    serviceName: order-service
    imageName: order-service
    dockerfilePath: Dockerfile
    containerRegistry: acrLoginServer
    qualitySteps:
    - task: JavaToolInstaller@0
      displayName: 'Use Java 21'
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: x64
        jdkSourceOption: PreInstalled

    - bash: |
        set -euo pipefail
        chmod +x mvnw
        ./mvnw --batch-mode --no-transfer-progress verify
      displayName: 'Test and build'
