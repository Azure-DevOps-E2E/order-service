server:
  port: ${PORT:8083}
  shutdown: graceful

spring:
  application:
    name: order-service
  jackson:
    default-property-inclusion: non_null

app:
  version: ${APP_VERSION:1.0.0}
  image-tag: ${APP_IMAGE_TAG:${app.version}}

services:
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}

logging:
  pattern:
    level: "%5p [${spring.application.name:order-service},%X{requestId:-unknown}]"
