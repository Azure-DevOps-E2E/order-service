server:
  port: ${PORT:8083}
  shutdown: graceful

spring:
  application:
    name: order-service
  jackson:
    default-property-inclusion: non_null

services:
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8000}

logging:
  pattern:
    level: "%5p [${spring.application.name:order-service},%X{requestId:-unknown}]"
